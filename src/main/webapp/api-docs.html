<!DOCTYPE html>
<!--
  Swagger UI for the sample-jee8 API.
  Assets come from the org.webjars:swagger-ui jar (see pom.xml swagger-ui.version);
  keep the version in the paths below in sync with that property.
  Served at:  http://localhost:7001/sample-jee8/api-docs.html
-->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>sample-jee8 API</title>
	<link rel="stylesheet" href="webjars/swagger-ui/5.32.14/swagger-ui.css">
	<style>
		html { box-sizing: border-box; }
		*, *:before, *:after { box-sizing: inherit; }
		body { margin: 0; background: #fafafa; }
	</style>
</head>
<body>
	<div id="swagger-ui"></div>
	<script src="webjars/swagger-ui/5.32.14/swagger-ui-bundle.js"></script>
	<script src="webjars/swagger-ui/5.32.14/swagger-ui-standalone-preset.js"></script>
	<script>
		window.ui = SwaggerUIBundle({
			url: 'api/openapi.json',
			dom_id: '#swagger-ui',
			deepLinking: true,
			presets: [
				SwaggerUIBundle.presets.apis,
				SwaggerUIStandalonePreset
			],
			layout: 'StandaloneLayout'
		});
	</script>
</body>
</html>
