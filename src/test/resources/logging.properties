# java.util.logging config for the test JVM (wired via maven-surefire-plugin).
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO

# The ExceptionMappers deliberately log (WARNING/SEVERE) every exception they map;
# the mapper tests feed them exceptions on purpose, so silence that noise here.
org.timsoft.api.error.level = OFF

# EclipseLink is already at WARNING via persistence.xml; keep only real errors.
org.eclipse.persistence.level = SEVERE
